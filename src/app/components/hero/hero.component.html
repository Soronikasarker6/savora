<section class="hero" aria-label="SAVORA Hero">
  <!-- Video Background -->
  <div class="hero-bg">
    <img
      class="hero-bg-img"
      src="https://images.unsplash.com/photo-1514190051997-0f6f39ca5cde?w=1920&q=80"
      alt=""
      role="presentation"
      loading="eager"
    />
    <div class="hero-overlay"></div>
    <div class="hero-overlay-radial"></div>
  </div>

  <!-- Content -->
  <div class="container hero-content" @heroContent>
    <!-- S Mark -->
    <div class="hero-mark hero-animate">
      <svg width="60" height="76" viewBox="-82 -170 234 348" xmlns="http://www.w3.org/2000/svg">
        <path d="M 18-170 C 74-170 118-144 118-100 C 118-68 98-46 64-30 L 20-10
                 C-34 12-82 40-82 90 C-82 144-32 178 30 178
                 C 80 178 118 158 134 128 C 142 112 144 94 144 78
                 L 108 78 C 108 96 96 122 36 144
                 C 0 156-26 148-44 134 C-58 122-46 108-18 100
                 C-4 96 12 90 24 84 L 64 66
                 C 114 44 152 12 152-38 C 152-104 100-152 28-166
                 C 24-168 20-170 18-170 Z"
              fill="#D4AF37"/>
        <path d="M 128-116 C 132-130 134-148 128-164
                 C 124-174 116-182 108-180 C 100-178 98-168 102-156
                 C 106-144 108-132 106-120 C 116-120 122-118 128-116 Z"
              fill="transparent"/>
      </svg>
    </div>

    <!-- Label -->
    <p class="hero-label hero-animate">
      <span class="line"></span>
      Multi-Cuisine Fine Dining
      <span class="line"></span>
    </p>

    <!-- Heading -->
    <h1 class="hero-title hero-animate">SAVORA</h1>

    <!-- Subtitle -->
    <p class="hero-subtitle hero-animate">Every Flavor Has a Story.</p>

    <!-- Tagline -->
    <p class="hero-desc hero-animate">
      Six cuisines. One philosophy. An experience crafted for the senses.
    </p>

    <!-- CTAs -->
    <div class="hero-ctas hero-animate">
      <a routerLink="/reservations" class="btn btn-primary btn-lg">
        Reserve a Table
      </a>
      <a routerLink="/menu" class="btn btn-outline btn-lg">
        Explore Menu
      </a>
    </div>

    <!-- Stats -->
    <div class="hero-stats hero-animate">
      <div class="stat">
        <span class="stat-number">6+</span>
        <span class="stat-label">Cuisines</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-number">120+</span>
        <span class="stat-label">Dishes</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-number">4.9★</span>
        <span class="stat-label">Rating</span>
      </div>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <button class="scroll-indicator" (click)="scrollToSection()" aria-label="Scroll to content">
    <span class="scroll-text">Discover</span>
    <span class="scroll-arrow">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </span>
  </button>
</section>
