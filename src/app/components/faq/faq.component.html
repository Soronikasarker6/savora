<section class="section faq-section">
  <div class="container">
    <div class="faq-grid">
      <div class="faq-intro">
        <span class="section-label" style="justify-content:flex-start">FAQ</span>
        <h2 class="section-title" style="text-align:left">Frequently Asked<br>Questions</h2>
        <span class="gold-line" style="margin: 20px 0"></span>
        <p style="color:var(--color-text-muted); font-size:15px; line-height:1.8">
          Have a question not answered here? We are always happy to help.
        </p>
        <a href="tel:+8801700000000" class="btn btn-outline" style="margin-top:24px">Call Us Directly</a>
      </div>

      <div class="faq-list">
        @for (faq of faqs; track faq.question; let i = $index) {
          <div class="faq-item" [class.open]="openIndex() === i">
            <button class="faq-question" (click)="toggle(i)"
                    [attr.aria-expanded]="openIndex() === i"
                    [attr.aria-controls]="'faq-answer-' + i">
              <span>{{ faq.question }}</span>
              <span class="faq-icon">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </span>
            </button>
            <div class="faq-answer" [id]="'faq-answer-' + i"
                 [style.max-height]="openIndex() === i ? '400px' : '0'">
              <p>{{ faq.answer }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
